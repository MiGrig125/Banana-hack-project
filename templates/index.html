<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="header">
    <div class="logo">
      <span class="logo-icon">◈</span>
      <span>{{ app_name }}</span>
    </div>
    <div class="header-status" id="healthStatus">проверка…</div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="modes">
        <button class="mode-btn active" data-mode="auto">Авто</button>
        <button class="mode-btn" data-mode="generate">Генерация</button>
        <button class="mode-btn" data-mode="edit">Редактирование</button>
        <button class="mode-btn" data-mode="analyze">Анализ</button>
        <button class="mode-btn" data-mode="enhance">Улучшение</button>
        <button class="mode-btn" data-mode="remove_bg">Удаление фона</button>
        <button class="mode-btn" data-mode="history">История</button>
      </nav>
      <div class="provider-box">
        <label for="providerSelect">Провайдер</label>
        <select id="providerSelect">
          <option value="">по умолчанию</option>
        </select>
        <p class="hint" id="providerHint"></p>
      </div>
    </aside>

    <main class="main">
      <section class="panel" id="workPanel">
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden />
          <div class="upload-inner">
            <p>Перетащите изображение сюда или <button type="button" id="pickFileBtn" class="link-btn">выберите файл</button></p>
            <p class="hint">JPEG / PNG / WEBP · до 15 МБ</p>
          </div>
          <div class="preview-source hidden" id="sourcePreview">
            <img id="sourceImg" alt="Исходное" />
            <button type="button" class="clear-btn" id="clearSource">✕</button>
          </div>
        </div>

        <div class="prompt-area">
          <textarea id="promptInput" rows="3" placeholder="Опишите, что нужно сделать…"></textarea>
          <div class="options-row" id="optionsRow">
            <div class="opt" id="enhanceModeWrap" hidden>
              <label>Режим улучшения</label>
              <select id="enhanceMode">
                <option value="auto">Авто</option>
                <option value="sharpen">Резкость</option>
                <option value="contrast">Контраст</option>
                <option value="denoise">Шумоподавление</option>
                <option value="upscale_basic">2× увеличение</option>
              </select>
            </div>
          </div>
          <button type="button" class="primary-btn" id="runBtn">
            <span class="btn-text">Запустить</span>
            <span class="spinner hidden" id="runSpinner"></span>
          </button>
        </div>

        <div class="status-bar" id="statusBar"></div>

        <div class="results" id="resultsArea">
          <div class="result-card hidden" id="imageResult">
            <h3>Результат</h3>
            <div class="compare">
              <div class="cmp-item" id="cmpSourceWrap" hidden>
                <span class="label">Исходное</span>
                <img id="cmpSource" alt="Исходное" />
              </div>
              <div class="cmp-item">
                <span class="label">Результат</span>
                <img id="resultImg" alt="Результат" />
              </div>
            </div>
            <a class="download-btn" id="downloadBtn" href="#" download>Скачать</a>
          </div>
          <div class="result-card hidden" id="textResult">
            <h3>Анализ</h3>
            <pre id="analysisText"></pre>
          </div>
        </div>
      </section>

      <section class="panel hidden" id="historyPanel">
        <h2>История операций</h2>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
