<!<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="header">
    <div class="logo">
      <span class="logo-icon">◈</span>
      <span>{{ app_name }}</span>
    </div>
    <div class="header-status" id="healthStatus">checking…</div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="modes">
        <button class="mode-btn active" data-mode="auto">Auto</button>
        
        
        <button class="mode-btn" data-mode="enhance">Enhance</button>
        <button class="mode-btn" data-mode="remove_bg">Remove background</button>
        <button class="mode-btn" data-mode="history">History</button>
      </nav>
      <div class="provider-box">
        <label for="providerSelect">Provider</label>
        <select id="providerSelect">
          <option value="">default</option>
        </select>
        <p class="hint" id="providerHint"></p>
      </div>
    </aside>

    <main class="main">
      <section class="panel" id="workPanel">
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden />
          <div class="upload-inner">
            <p>Drag & drop an image here or <button type="button" id="pickFileBtn" class="link-btn">choose a file</button></p>
            <p class="hint">JPEG / PNG / WEBP · up to 15 MB</p>
          </div>
          <div class="preview-source hidden" id="sourcePreview">
            <img id="sourceImg" alt="Source" />
            <button type="button" class="clear-btn" id="clearSource">✕</button>
          </div>
        </div>

        <div class="prompt-area">
          <textarea id="promptInput" rows="3" placeholder="Describe what you want…"></textarea>
          <div class="options-row" id="optionsRow">
            <div class="opt" id="enhanceModeWrap" hidden>
              <label>Enhance mode</label>
              <select id="enhanceMode">
                <option value="auto">Auto</option>
                <option value="sharpen">Sharpen</option>
                <option value="contrast">Contrast</option>
                <option value="denoise">Denoise</option>
                <option value="upscale_basic">2× upscale</option>
              </select>
            </div>
          </div>
          <button type="button" class="primary-btn" id="runBtn">
            <span class="btn-text">Run</span>
            <span class="spinner hidden" id="runSpinner"></span>
          </button>
        </div>

        <div class="status-bar" id="statusBar"></div>

        <div class="results" id="resultsArea">
          <div class="result-card hidden" id="imageResult">
            <h3>Result</h3>
            <div class="compare">
              <div class="cmp-item" id="cmpSourceWrap" hidden>
                <span class="label">Source</span>
                <img id="cmpSource" alt="Source" />
              </div>
              <div class="cmp-item">
                <span class="label">Result</span>
                <img id="resultImg" alt="Result" />
              </div>
            </div>
            <a class="download-btn" id="downloadBtn" href="#" download>Download</a>
          </div>
          <div class="result-card hidden" id="textResult">
            <h3>Analysis</h3>
            <pre id="analysisText"></pre>
          </div>
        </div>
      </section>

      <section class="panel hidden" id="historyPanel">
        <h2>Operation history</h2>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
